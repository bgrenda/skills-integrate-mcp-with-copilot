<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="teacher-session">
        <span id="teacher-status">Public view</span>
        <button id="teacher-login-button" type="button" aria-haspopup="dialog">
          <span aria-hidden="true">&#128100;</span> Teacher sign in
        </button>
        <button id="teacher-logout-button" class="hidden" type="button">Sign out</button>
      </div>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" class="hidden">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <dialog id="teacher-login-dialog" class="teacher-login-dialog">
      <form id="teacher-login-form">
        <div class="login-heading">
          <h2>Teacher sign in</h2>
          <button id="close-login-button" class="close-login-button" type="button" aria-label="Close sign-in dialog">&times;</button>
        </div>
        <p>Sign in to register or unregister students.</p>
        <div class="form-group">
          <label for="teacher-email">Teacher email</label>
          <input id="teacher-email" type="email" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="teacher-password">Password</label>
          <input id="teacher-password" type="password" autocomplete="current-password" required />
        </div>
        <p id="teacher-login-error" class="error hidden" role="alert"></p>
        <button type="submit">Sign in</button>
      </form>
    </dialog>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
